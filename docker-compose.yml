services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dpa-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: .
    container_name: dpa-web
    # host port 5001: 5000 on the host is macOS AirPlay Receiver
    ports:
      - "5001:5000"
    environment:
      DPA_ConnectionStrings__Local: "Server=sqlserver,1433;Database=DataProcessingAppDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=True"
    depends_on:
      sqlserver:
        condition: service_healthy
