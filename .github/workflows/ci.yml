name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DataProcessingApp.sln
      - name: Test
        run: dotnet test tests/DataProcessingApp.Tests --no-build --verbosity normal

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r src/PythonDataApp/requirements.txt -r tests/python/requirements.txt
      - name: Test
        run: python -m pytest tests/python -q
